version: 2
updates:
  # Minor + patch bumps land as one weekly PR; majors stay individual,
  # except eslint + @eslint/* majors, which must move together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      dev-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      eslint-major:
        patterns:
          - 'eslint'
          - '@eslint/*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      pre-commit-hooks:
        patterns:
          - '*'
