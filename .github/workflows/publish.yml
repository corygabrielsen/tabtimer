name: Publish to Chrome Web Store

# Manual-only for now: trigger from the Actions tab. Builds the extension,
# packages dist/, and uploads + publishes it via the Chrome Web Store API.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0). Blank = version in package.json.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gates the CWS_* secrets behind the environment's protection rules.
    environment: chrome-web-store
    env:
      # Plain version in the manifest (no commit in version_name; see vite.config.ts).
      TABTIMER_RELEASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(jq -r .version package.json)"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version' (expected X.Y.Z)."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # package.json is the source of truth; the build stamps it onto the
          # manifest (see vite.config.ts).
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Typecheck, lint, format check, and test
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run format:check
          pnpm run test

      - name: Package
        run: |
          pnpm package
          unzip -l tabtimer.zip

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ZIP_PATH: tabtimer.zip
        run: ./scripts/publish-chrome-web-store.sh
