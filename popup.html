<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appName">Tab Timer</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/popup.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand" data-i18n="appName">Tab Timer</span>
      <button id="manage-btn" type="button" class="btn btn-quiet" data-i18n="popupSettings">Settings</button>
    </header>

    <main class="body">
      <!-- Tracked site: today's time, limit progress, state, actions. -->
      <section id="tracked" hidden aria-labelledby="site">
        <div id="hero" class="hero" data-state="open">
          <div class="hero-top">
            <h1 id="site" class="host"></h1>
            <span id="status" class="status"></span>
          </div>
          <p class="readout figure" data-i18n-attr="title=tooltipToday">
            <span class="visually-hidden" data-i18n="labelToday">Today</span>
            <span id="today">00:00:00</span>
          </p>
          <div id="meter" class="meter" role="meter" aria-valuemin="0" hidden></div>
          <p id="summary" class="summary" aria-live="polite"></p>
        </div>

        <p id="global-line" class="global" hidden></p>

        <div class="controls">
          <div class="control">
            <label for="site-limit" class="control-label" data-i18n="popupLimit">Daily limit</label>
            <span class="minutes">
              <span id="site-limit-saved" class="saved" role="status"></span>
              <input
                id="site-limit"
                class="field"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="off"
                aria-describedby="site-limit-error"
                data-i18n-attr="placeholder=optionsLimitOff"
              />
              <span class="unit" data-i18n="optionsMinutes">min</span>
            </span>
          </div>
          <p id="site-limit-error" class="error control-error" hidden></p>

          <div class="control">
            <span id="overlay-label" class="control-label" data-i18n="overlaySwitchLabel">Show timer on the page</span>
            <button
              id="toggle-btn"
              type="button"
              class="switch"
              role="switch"
              aria-checked="true"
              aria-labelledby="overlay-label"
            ></button>
          </div>
        </div>

        <div class="actions">
          <button id="reset-btn" type="button" class="btn btn-quiet" data-i18n="popupResetToday">Reset today</button>
        </div>
      </section>

      <!-- A website that isn't tracked yet: one primary action. -->
      <section id="enable" hidden aria-labelledby="enable-site">
        <div class="hero" data-state="idle">
          <div class="hero-top">
            <h1 id="enable-site" class="host"></h1>
            <span class="status" data-i18n="popupNotTrackedTitle">Not tracked</span>
          </div>
          <p class="readout figure" aria-hidden="true">--:--:--</p>
          <p class="summary" data-i18n="popupNotTracking">Tab Timer only counts time on sites you choose.</p>
        </div>
        <button id="enable-btn" type="button" class="btn btn-primary wide" data-i18n="popupEnableSite">
          Track this site
        </button>
      </section>

      <!-- Browser pages, the Web Store, files: extensions can't run there. -->
      <section id="untracked" hidden aria-labelledby="untracked-title">
        <h1 id="untracked-title" class="lead" data-i18n="popupCantTrack">This page can't be tracked</h1>
        <p class="note" data-i18n="popupCantTrackDetail">
          Browser pages, the Chrome Web Store and local files are off-limits to extensions. Open a website to track it.
        </p>
      </section>

      <p id="loading" class="note" data-i18n="popupLoading">Loading…</p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
